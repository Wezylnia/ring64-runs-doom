<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#faeee1" />
    <meta
      name="description"
      content="an open-source x86 and x86-64 cpu emulator for javascript runtimes."
    />
    <title>ring64</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="./assets/fonts/national-park.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="shell">
      <header class="masthead">
        <a class="wordmark" href="./">
          <img src="./assets/logo.svg" width="300" height="146" alt="ring64" />
        </a>
        <nav aria-label="project links">
          <a href="https://www.npmjs.com/package/ring64"><span class="nav-label">npm</span></a>
          <a href="https://github.com/fatihguzeldev/ring64" id="github-link">
            <span id="github-stars" class="star-count" aria-hidden="true" hidden>
              <svg
                viewBox="0 0 24 24"
                width="15"
                height="15"
                fill="none"
                stroke="currentColor"
                stroke-width="1.65"
              >
                <path
                  d="m12 3 2.8 5.7 6.3.9-4.5 4.4 1.1 6.2-5.7-3-5.7 3 1.1-6.2-4.5-4.4 6.3-.9z"
                  stroke-linejoin="round"
                />
              </svg>
              <span id="github-star-value"></span>
            </span>
            <span class="nav-label">github</span>
          </a>
        </nav>
      </header>

      <main>
        <div class="project-overview">
          <h1 class="project-slogan">
            x86 cpu emulator<br />
            for javascript runtimes
          </h1>
          <div class="install">
            <code id="install-command">npm install ring64</code>
            <button
              type="button"
              id="copy-install"
              class="icon-button"
              aria-label="copy install command"
              title="copy install command"
              hidden
            >
              <svg
                class="copy-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                aria-hidden="true"
              >
                <rect x="8" y="8" width="12" height="12" rx="2" />
                <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" />
              </svg>
              <svg
                class="copied-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                aria-hidden="true"
              >
                <path d="m5 12 4 4 10-10" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
            <span id="copy-status" class="visually-hidden" role="status"></span>
          </div>
        </div>
        <figure class="wet-ink" aria-labelledby="wet-ink-title">
          <figcaption class="ink-caption">
            <h2 id="wet-ink-title">wet ink<sup class="ink-note-mark" aria-hidden="true">*</sup></h2>
            <p>
              <span class="ink-note-mark" aria-hidden="true">*</span>
              ink folds into itself. move through it and watch the edges unravel.
            </p>
            <span id="ink-guide" class="visually-hidden">
              stir with the pointer or arrow keys. press space on the canvas to pause or resume.
            </span>
          </figcaption>
          <div class="ink-display">
            <div id="ink-stage" class="ink-stage">
              <canvas
                id="ink"
                width="3840"
                height="2160"
                tabindex="0"
                aria-label="interactive flowing ink"
                aria-describedby="ink-guide"
              ></canvas>
              <p id="status" class="ink-status" role="status"></p>
              <noscript><p class="ink-status">enable javascript to run the ink.</p></noscript>
            </div>
            <div class="ink-controls">
              <button
                type="button"
                id="play"
                class="icon-button"
                aria-label="play"
                title="play"
                disabled
              >
                <svg
                  class="play-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.65"
                  aria-hidden="true"
                >
                  <path d="m9 5 11 7-11 7z" stroke-linejoin="round" />
                </svg>
                <svg
                  class="pause-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.65"
                  aria-hidden="true"
                >
                  <path d="M9 6v12m6-12v12" stroke-linecap="round" />
                </svg>
              </button>
              <button
                type="button"
                id="fullscreen"
                class="icon-button"
                aria-label="fullscreen"
                title="fullscreen"
                hidden
              >
                <svg
                  class="expand-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.65"
                  aria-hidden="true"
                >
                  <path
                    d="M9 5H5v4m10-4h4v4m0 6v4h-4m-6 0H5v-4"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                <svg
                  class="collapse-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.65"
                  aria-hidden="true"
                >
                  <path
                    d="M5 9h4V5m6 0v4h4m0 6h-4v4m-6 0v-4H5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
            </div>
          </div>
        </figure>
      </main>

      <footer class="colophon">
        <div class="footer-links">
          <a href="https://github.com/fatihguzeldev/ring64#usage">usage examples</a>
          <a href="./assets/wet-ink/wet-ink.bin" download="wet-ink.x86-64.bin">wet ink binary</a>
        </div>
        <p class="signature">built by <a href="https://fatihguzel.dev/">fatih guzel</a></p>
        <a class="source" href="https://github.com/fatihguzeldev/ring64">source on github</a>
      </footer>
    </div>
    <script type="module" src="./site.js"></script>
    <script type="module" src="./wet-ink/index.js"></script>
  </body>
</html>
