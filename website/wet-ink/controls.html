<div class="ink-controls">
  <button type="button" id="play" class="icon-button" aria-label="play" title="play" disabled>
    <svg
      class="play-icon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.65"
      aria-hidden="true"
    >
      <path d="m9 5 11 7-11 7z" stroke-linejoin="round" />
    </svg>
    <svg
      class="pause-icon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.65"
      aria-hidden="true"
    >
      <path d="M9 6v12m6-12v12" stroke-linecap="round" />
    </svg>
  </button>
  <button
    type="button"
    id="fullscreen"
    class="icon-button"
    aria-label="fullscreen"
    title="fullscreen"
    hidden
  >
    <svg
      class="expand-icon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.65"
      aria-hidden="true"
    >
      <path
        d="M9 5H5v4m10-4h4v4m0 6v4h-4m-6 0H5v-4"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
    <svg
      class="collapse-icon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.65"
      aria-hidden="true"
    >
      <path
        d="M5 9h4V5m6 0v4h4m0 6h-4v4m-6 0v-4H5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>
</div>
