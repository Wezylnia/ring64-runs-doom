<div id="ink-stage" class="ink-stage">
  <span id="ink-guide" class="visually-hidden">
    stir with the pointer or arrow keys. press space on the canvas to pause or resume.
  </span>
  <canvas
    id="ink"
    width="3840"
    height="2160"
    tabindex="0"
    aria-label="interactive flowing ink"
    aria-describedby="ink-guide"
  ></canvas>
  <p id="status" class="ink-status" role="status"></p>
  <noscript><p class="ink-status">enable javascript to run the ink.</p></noscript>
</div>
